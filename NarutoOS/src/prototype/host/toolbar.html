<!doctype html>
<html lang="zh-CN" class="interface-pending"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:"><link rel="stylesheet" href="host-style.css"><link rel="stylesheet" href="toolbar.css"><title>Naruto OS</title></head>
<body><header class="chrome"><div class="tabline"><span class="traffic-space" aria-hidden="true"></span><button id="exit-fullscreen" class="quiet small" hidden data-i18n="ui.window_mode">窗口模式</button>
<button id="center" class="icon-button" aria-label="打开启动中心" data-i18n-aria-label="ui.open_launch_center"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8M5 10v11h5v-7h4v7h5V10"/></svg></button>
<nav id="tabs" aria-label="游戏标签" data-i18n-aria-label="ui.game_tabs"></nav><button id="new-tab" class="icon-button add" aria-label="选择或打开其他账号" data-i18n-aria-label="ui.select_or_open_another_account"></button><span class="drag-space"></span>
<button id="notice" class="status" aria-live="polite" aria-label="查看提示详情" data-i18n-aria-label="ui.view_notice_details"></button>
<aside id="save-prompt" hidden><span id="save-text"></span><button id="save" class="primary small" data-i18n="common.save">保存</button><button id="dismiss" class="quiet small" data-i18n="ui.not_now">暂不</button></aside>
<div class="tools"><button id="retry-exit" class="quiet small" hidden data-i18n="ui.retry_save_and_quit">重试保存并退出</button><button id="cancel-recovery" class="quiet small" hidden data-i18n="ui.cancel_recovery">取消恢复</button><button id="complete" class="primary small" hidden data-i18n="ui.complete_switch">完成切换</button><button id="refresh" class="icon-button" aria-label="刷新／恢复当前游戏" data-i18n-aria-label="ui.refresh_recover_current_game"></button><button id="speed" class="icon-button speed-rate" hidden aria-label="切换游戏倍率" data-i18n-aria-label="ui.speed_rate_toggle">1×</button><button id="mute" class="icon-button" aria-label="总静音" aria-pressed="false" data-i18n-aria-label="ui.mute_all"></button><button id="settings" class="icon-button" aria-label="设置" data-i18n-aria-label="settings.title"></button></div>
</div></header><main id="placeholder" class="placeholder" hidden><p id="placeholder-title"></p><span id="placeholder-detail"></span><button id="placeholder-recover" class="quiet" data-i18n="ui.re_enter_game">重新进入游戏</button></main><script src="toolbar.js"></script></body></html>
